# Docker Stack file (Swarm-style). Differences from docker-compose.yml:
#  * no "build:" -> images must already be pushed to a registry
#  * no "depends_on" conditions -> Swarm restarts failed tasks instead
#  * nginx.conf is delivered with a Docker "config" (bind mounts do not work across nodes)
#
# Deploy (after: docker swarm init):
#   set -a; . ./.env; set +a
#   export DOCKERHUB_USER=<your-dockerhub-username>
#   docker stack deploy -c docker-stack.yml campushub
#
# Remove:  docker stack rm campushub
version: "3.8"

services:
  gateway:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    configs:
      - source: nginx_conf
        target: /etc/nginx/conf.d/default.conf
    networks: [frontend, backend]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      replicas: 1
      restart_policy: { condition: on-failure }
      resources:
        limits: { cpus: "0.25", memory: 64M }

  frontend:
    image: ${DOCKERHUB_USER}/campushub-frontend:1.0
    networks: [frontend]
    deploy:
      replicas: 2
      restart_policy: { condition: on-failure }
      update_config: { parallelism: 1, delay: 10s }
      resources:
        limits: { cpus: "0.25", memory: 64M }

  api:
    image: ${DOCKERHUB_USER}/campushub-api:1.0
    environment:
      PORT: "3000"
      PGHOST: db
      PGUSER: ${PGUSER}
      PGPASSWORD: ${PGPASSWORD}
      PGDATABASE: ${PGDATABASE}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASS: ${RABBITMQ_PASS}
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET}
      SMTP_HOST: mailhog
      SMTP_PORT: "1025"
    networks: [backend, data]
    deploy:
      replicas: 2
      restart_policy: { condition: any, delay: 5s }
      update_config: { parallelism: 1, delay: 10s, order: start-first }
      resources:
        limits: { cpus: "0.50", memory: 256M }

  worker:
    image: ${DOCKERHUB_USER}/campushub-api:1.0
    command: ["node", "src/worker.js"]
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASS: ${RABBITMQ_PASS}
      SMTP_HOST: mailhog
      SMTP_PORT: "1025"
    healthcheck:
      disable: true
    networks: [backend, data]
    deploy:
      replicas: 1
      restart_policy: { condition: any, delay: 5s }
      resources:
        limits: { cpus: "0.25", memory: 128M }

  db:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_USER: ${PGUSER}
      POSTGRES_PASSWORD: ${PGPASSWORD}
      POSTGRES_DB: ${PGDATABASE}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      replicas: 1
      restart_policy: { condition: any }
      resources:
        limits: { cpus: "0.50", memory: 384M }

  redis:
    image: redis:7.4-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\""]
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      replicas: 1
      restart_policy: { condition: any }
      resources:
        limits: { cpus: "0.25", memory: 128M }

  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
      RABBITMQ_ERLANG_COOKIE: campushub-cookie-2026
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q check_port_connectivity"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 90s
    deploy:
      replicas: 1
      restart_policy: { condition: any }
      resources:
        limits: { cpus: "0.50", memory: 1024M }

  minio:
    image: ghcr.io/l33tlamer/minio-backup@sha256:a1ea29fa28355559ef137d71fc570e508a214ec84ff8083e39bc5428980b015e
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - miniodata:/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || curl -f http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      replicas: 1
      restart_policy: { condition: any }
      resources:
        limits: { cpus: "0.50", memory: 384M }

  mailhog:
    image: mailhog/mailhog:v1.0.1
    networks: [backend]
    deploy:
      replicas: 1
      restart_policy: { condition: any }
      resources:
        limits: { cpus: "0.25", memory: 64M }

configs:
  nginx_conf:
    file: ./app/nginx.conf

networks:
  frontend: { driver: overlay }
  backend:  { driver: overlay }
  data:     { driver: overlay }

volumes:
  pgdata:
  miniodata:
