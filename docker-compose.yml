# CampusHub - 9 services. Start with:  docker compose up -d --build --wait
name: campushub

services:
  # ---------------- public entry point ----------------
  gateway:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-8080}:8080"          # the ONLY port open to the network
    volumes:
      - ./app/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend: { condition: service_healthy }
      api:      { condition: service_healthy }
      minio:    { condition: service_healthy }
    networks: [frontend, backend]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 64M }

  # ---------------- web UI (static files) ----------------
  frontend:
    build:
      context: ./app/frontend
    image: campushub-frontend:1.0
    restart: unless-stopped
    networks: [frontend]
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 64M }

  # ---------------- REST API ----------------
  api:
    build:
      context: ./app/api
    image: campushub-api:1.0
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:       { condition: service_healthy }
      redis:    { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      minio:    { condition: service_healthy }
    networks: [backend, data]
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 256M }

  # ---------------- background worker (same image as api) ----------------
  worker:
    image: campushub-api:1.0
    pull_policy: never                 # image is built by the api service
    restart: unless-stopped
    command: ["node", "src/worker.js"]
    env_file: .env
    healthcheck:
      disable: true                    # do NOT inherit the API's HTTP health check
    depends_on:
      api:      { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      mailhog:  { condition: service_started }
    networks: [backend, data]
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 128M }

  # ---------------- PostgreSQL ----------------
  db:
    image: postgres:16.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PGUSER}
      POSTGRES_PASSWORD: ${PGPASSWORD}
      POSTGRES_DB: ${PGDATABASE}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 384M }

  # ---------------- Redis (cache, password protected) ----------------
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\""]
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 128M }

  # ---------------- RabbitMQ (message queue) ----------------
  rabbitmq:
    image: rabbitmq:3.13-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
      RABBITMQ_ERLANG_COOKIE: campushub-cookie-2026
    ports:
      - "127.0.0.1:15672:15672"        # management UI, this machine only
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q check_port_connectivity"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 90s
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 1024M }

  # ---------------- MinIO (S3-compatible object storage) ----------------
  minio:
    image: ghcr.io/l33tlamer/minio-backup@sha256:a1ea29fa28355559ef137d71fc570e508a214ec84ff8083e39bc5428980b015e
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - miniodata:/data
    ports:
      - "127.0.0.1:9001:9001"          # MinIO console, this machine only
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || curl -f http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 384M }

  # ---------------- MailHog (fake SMTP server + inbox UI) ----------------
  mailhog:
    image: mailhog/mailhog:v1.0.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"          # inbox UI, this machine only
    networks: [backend]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8025/"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 64M }

networks:
  frontend:   # public tier: gateway <-> frontend
  backend:    # app tier: gateway, api, worker, minio, mailhog
  data:       # datastores: db, redis, rabbitmq (only api + worker can reach them)

volumes:
  pgdata:
  miniodata:
